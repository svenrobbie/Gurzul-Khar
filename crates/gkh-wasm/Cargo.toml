[package]
name = "gkh-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for gkh-core, so the website runs the same engine as everything else."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gkh-core = { path = "../gkh-core" }
wasm-bindgen = "0.2"
