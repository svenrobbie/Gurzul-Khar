name: Rust

# The Rust core and the TypeScript engine are held to the same behaviour by
# the shared fixtures in tests/fixtures/. This workflow runs the Rust half;
# ci.yml runs the TypeScript half. When the two implementations disagree about
# the language, one of them goes red here rather than the difference reaching
# an app.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate the compiled-in language data
        run: npm run rust:data

      - name: Fail if the generated data is stale
        # The Rust crate compiles data/*.json in as constants. If someone edits
        # the JSON without regenerating, Rust and TypeScript silently describe
        # different languages — so the generated files must already be current.
        run: |
          if ! git diff --quiet -- crates/; then
            echo "::error::Generated Rust data is out of date. Run 'npm run rust:data' and commit the result."
            git diff --stat -- crates/
            exit 1
          fi

      - name: Test the core and the bindings
        run: cargo test --workspace

      - name: Warnings are errors
        run: cargo build --workspace
        env:
          RUSTFLAGS: "-D warnings"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly package
        run: wasm-pack build crates/gkh-wasm --target web --out-dir pkg

      - name: Report the artifact size
        # This ships to every visitor, so a jump is worth noticing.
        run: ls -la crates/gkh-wasm/pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: gkh-wasm-pkg
          path: crates/gkh-wasm/pkg/
